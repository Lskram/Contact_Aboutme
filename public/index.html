<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lskram — Portfolio</title>
  <link rel="stylesheet" href="/css/tailwind.css">
</head>
<body>
<!-- Notification Overlay -->
<div id="clickNotification" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md transition-opacity duration-500">
  <div class="relative bg-gradient-to-br from-purple-900/90 via-pink-900/90 to-blue-900/90 rounded-3xl p-8 md:p-12 border-2 border-purple-400/50 shadow-2xl shadow-purple-500/50 max-w-md mx-4 animate-float">
    <!-- Glowing border -->
    <div class="absolute -inset-1 bg-gradient-to-r from-purple-600 via-pink-600 to-blue-600 rounded-3xl opacity-75 blur-xl animate-pulse-slow"></div>
    
    <div class="relative text-center">
      <!-- Icon -->
      <div class="mb-6 flex justify-center">
        <div class="relative">
          <div class="absolute inset-0 bg-gradient-to-r from-purple-500 to-pink-500 rounded-full blur-2xl opacity-60 animate-pulse"></div>
          <svg class="relative w-16 h-16 text-purple-300 animate-bounce-gentle" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path>
          </svg>
        </div>
      </div>
      
      <!-- Message -->
      <h2 class="text-2xl md:text-3xl font-bold mb-4 bg-gradient-to-r from-purple-300 via-pink-300 to-blue-300 bg-clip-text text-transparent">
        ฟังกูนะ !!👋
      </h2>
      <p class="text-white/90 text-lg mb-6 leading-relaxed">
        กรุณา <span class="text-purple-300 font-semibold">แตะหน้าจอ</span> ไม่งั้นมันไม่เท่ห์เว้ยเห้ย 5555<br>
        <span class="text-sm text-purple-300/80">(เพลงจะเล่นอัตโนมัติ)</span>
      </p>
      
      <!-- Click indicator -->
      <div class="flex justify-center gap-2 animate-pulse">
        <div class="w-3 h-3 bg-purple-400 rounded-full animate-ping"></div>
        <div class="w-3 h-3 bg-pink-400 rounded-full animate-ping delay-100"></div>
        <div class="w-3 h-3 bg-blue-400 rounded-full animate-ping delay-200"></div>
      </div>
    </div>
  </div>
</div>

<!-- Main Content -->
<section class="fixed inset-0 flex items-center justify-center px-4 py-8 overflow-hidden">
  <div class="w-full max-w-xl md:max-w-2xl lg:max-w-3xl h-full max-h-[90vh] flex items-center justify-center">
    
    <!-- Floating particles background -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div class="particle particle-1"></div>
      <div class="particle particle-2"></div>
      <div class="particle particle-3"></div>
      <div class="particle particle-4"></div>
      <div class="particle particle-5"></div>
    </div>

    <!-- Profile Card Container -->
    <div class="relative group/card">
      <!-- Outer glow ring - animated -->
      <div class="absolute -inset-1 bg-gradient-to-r from-purple-600 via-pink-600 to-blue-600 rounded-3xl opacity-0 group-hover/card:opacity-100 blur-2xl transition-all duration-1000 animate-gradient-rotate"></div>
      
      <!-- Middle glow pulse -->
      <div class="absolute -inset-0.5 bg-gradient-to-r from-purple-500 via-pink-500 to-blue-500 rounded-3xl opacity-75 blur-md animate-pulse-slow"></div>
      
      <!-- Main Card -->
      <div class="relative bg-gradient-to-br from-zinc-800/95 via-zinc-900/95 to-black/95 rounded-3xl p-8 md:p-12 border-2 border-purple-400/30 backdrop-blur-2xl shadow-[0_0_80px_rgba(168,85,247,0.4)] transform transition-all duration-700 hover:shadow-[0_0_120px_rgba(168,85,247,0.6)] hover:scale-[1.03] hover:border-purple-400/60 overflow-hidden">
        
        <!-- GIF Background with blur -->
        <div class="absolute inset-0 rounded-3xl overflow-hidden">
          <img src="/images/1018.gif" 
               class="w-full h-full object-cover opacity-20 blur-sm" 
               alt="background">
          <div class="absolute inset-0 bg-gradient-to-br from-black/60 via-black/50 to-black/60"></div>
        </div>
        
        <!-- Content wrapper -->
        <div class="relative z-10">
        
        <!-- Decorative corner elements -->
        <div class="absolute top-0 left-0 w-20 h-20 border-t-2 border-l-2 border-purple-400/30 rounded-tl-3xl"></div>
        <div class="absolute bottom-0 right-0 w-20 h-20 border-b-2 border-r-2 border-pink-400/30 rounded-br-3xl"></div>
        
        <!-- Floating orbs -->
        <div class="absolute top-4 right-4 w-12 h-12 bg-purple-500/20 rounded-full blur-xl animate-float"></div>
        <div class="absolute bottom-4 left-4 w-16 h-16 bg-pink-500/20 rounded-full blur-xl animate-float-delayed"></div>
        
        <!-- Avatar & Name Section - SIDE BY SIDE with entrance animation -->
        <div class="flex items-center justify-center gap-6 md:gap-8 lg:gap-10 mb-4 flex-wrap" id="profileSection">
          
          <!-- Avatar -->
          <div class="relative group/avatar animate-slide-in-left">
            <!-- Multiple glow layers -->
            <div class="absolute -inset-4 bg-gradient-to-r from-purple-500 via-pink-500 to-blue-500 rounded-full blur-3xl opacity-0 group-hover/avatar:opacity-100 transition-all duration-700 animate-spin-very-slow"></div>
            <div class="absolute -inset-2 bg-gradient-to-r from-pink-500 via-purple-500 to-blue-500 rounded-full blur-2xl opacity-60 group-hover/avatar:opacity-90 transition-all duration-500 animate-pulse"></div>
            
            <!-- Avatar container -->
            <div class="relative">
              <!-- Outer rotating particles ring -->
              <div class="absolute -inset-8 animate-spin-slow">
                <!-- 12 particles around the circle with pulse animation -->
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3 h-3 bg-purple-400 rounded-full shadow-[0_0_12px_rgba(168,85,247,0.8)] animate-particle-pulse"></div>
                <div class="absolute top-[6.7%] right-[6.7%] w-3 h-3 bg-pink-400 rounded-full shadow-[0_0_12px_rgba(236,72,153,0.8)] animate-particle-pulse delay-100"></div>
                <div class="absolute top-1/4 right-0 w-3 h-3 bg-blue-400 rounded-full shadow-[0_0_12px_rgba(59,130,246,0.8)] animate-particle-pulse delay-200"></div>
